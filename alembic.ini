# Aumne AI - Alembic Database Configuration

[alembic]

# Location of migration scripts
script_location = %(here)s/alembic

# Python module search path
prepend_sys_path = .

# Path separator for configuration paths
path_separator = os

# SQLite database connection
sqlalchemy.url = sqlite:///./aumne_ai.db


# Post-write hooks
[post_write_hooks]


# Logging configuration
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic


[logger_root]
level = WARNING
handlers = console
qualname =


[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine


[logger_alembic]
level = INFO
handlers =
qualname = alembic


[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic


[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S